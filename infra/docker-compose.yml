version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentiment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentiment_user
      POSTGRES_PASSWORD: sentiment_pass
      POSTGRES_DB: sentiment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment_user -d sentiment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentiment_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: sentiment_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sentiment_user:sentiment_pass@postgres:5432/sentiment_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-sentiment-key-change-in-production-min32chars}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
    ports:
      - "8000:8000"

  nlp-worker:
    build:
      context: ./services/nlp-worker
      dockerfile: Dockerfile
    container_name: sentiment_nlp_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sentiment_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_WS_URL: ws://api:8000/ws/live-feed
    ports:
      - "3000:3000"

volumes:
  postgres_data:
