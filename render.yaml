services:
  # 1. FastAPI Backend API (Free Tier)
  - type: web
    name: pulseai-api
    runtime: python
    plan: free
    buildCommand: "pip install -r services/api/requirements.txt && python -c 'import nltk; nltk.download(\"vader_lexicon\", quiet=True)'"
    startCommand: "uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseai-db
          property: connectionString

  # 2. Next.js Web Dashboard (Free Tier)
  - type: web
    name: pulseai-web
    runtime: node
    plan: free
    buildCommand: "cd packages/shared-types && npm install && npm run build && cd ../../apps/web && npm install && npm run build"
    startCommand: "cd apps/web && npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pulseai-api
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: pulseai-api
          property: host

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: pulseai-db
    databaseName: sentiment_db
    user: sentiment_user
    plan: free
